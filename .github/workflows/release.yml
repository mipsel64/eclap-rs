name: Release
run-name: Release ${{ github.ref_name }}

on:
  push:
    tags: ['v*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  RUSTUP_TOOLCHAIN: '1.96'
  CARGO_TERM_COLOR: always

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
      - name: Validate release version
        run: |
          versions=$(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[].version' | sort -u)
          if [ "$GITHUB_REF_NAME" != "v$versions" ]; then
            echo "Tag must equal v + the version of every crate, found: $versions" >&2
            exit 1
          fi
      - run: cargo test --locked
      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: |
          version=${GITHUB_REF_NAME#v}
          # Dependency order; versions already on crates.io are skipped so a failed run can be re-run.
          for crate in eclap-derive eclap; do
            status=$(curl -sS -o /dev/null -w '%{http_code}' -A "eclap-rs release (https://github.com/$GITHUB_REPOSITORY)" "https://crates.io/api/v1/crates/$crate/$version")
            if [ "$status" = 200 ]; then
              echo "$crate $version is already published"
            else
              cargo publish --locked -p "$crate"
            fi
          done

  release:
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          prerelease=()
          if [[ "${TAG%%+*}" == *-* ]]; then
            prerelease=(--prerelease)
          fi
          gh release create "$TAG" -R "$GITHUB_REPOSITORY" --verify-tag --generate-notes "${prerelease[@]}"
